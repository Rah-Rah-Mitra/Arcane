[package]
name = "arcane"
version = "0.2.0"
edition = "2021"
description = "A local-first research archival application for managing Projects and Sources"
authors = ["Arcane Contributors"]
license = "MIT"

[[bin]]
name = "arcane"
path = "src/main.rs"

[dependencies]
# PDF manipulation — extract PageLabels, Outlines, and split documents
lopdf = "0.39.0"

# Serialisation / deserialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# CLI framework
clap = { version = "4.5", features = ["derive"] }

# Storage — embedded SQLite (compiled from source, no system dependency)
rusqlite = { version = "0.33", features = ["bundled"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Full-text search
tantivy = "0.22"

# Content-addressable hashing
blake3 = "1"

# Parallel processing
rayon = "1.10"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# File watching
notify = "7"

# Fuzzy string matching (Levenshtein, Jaro-Winkler)
strsim = "0.11"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[features]
default = []
# Build with OCR support: cargo build --release --features ocr
# Requires onnxruntime.dll v1.24.x at runtime (set ORT_DYLIB_PATH or place next to binary).
# Download from: https://github.com/microsoft/onnxruntime/releases/tag/v1.24.1
# Also requires OCR models in models/ — see docs/USER_GUIDE.md.
ocr = ["dep:oar-ocr", "dep:pdfium-render", "dep:ort"]

[dev-dependencies]
tempfile = "3"

# ---------------------------------------------------------------------------
# OCR overlay (optional — cargo build --features ocr)
# ---------------------------------------------------------------------------
[dependencies.oar-ocr]
version = "0.6"
optional = true
# disable download-binaries so oar-ocr itself doesn't pull in features we override
default-features = false

[dependencies.pdfium-render]
version = "0.8"
optional = true
features = ["image"]

# ort with load-dynamic: loads ONNX Runtime as a DLL at runtime instead of
# statically linking the prebuilt static library.  This avoids MSVC ABI
# incompatibility issues with the prebuilt ort-sys static lib.
# api-24 enables all OrtApi fields up to v1.24 (needed for load-dynamic EP stubs).
[dependencies.ort]
version = "2.0.0-rc.12"
optional = true
default-features = false
features = ["load-dynamic", "ndarray", "api-24"]
